schema_version: 1.0.0
spend_policy: FREE_ONLY
maximum_new_service_charge: 0
paid_overage_authorized: false
billing_activation_allowed: false
payment_method_addition_allowed: false
paid_trials_allowed: false
paid_upgrade_prompts_allowed: false
classes:
  CI_COMPUTE: {mode: verified_free_only}
  METERED_MODEL_RUNTIME: {mode: unavailable_unless_no_new_charge}
  STORAGE: {mode: verified_free_only}
  THIRD_PARTY_SERVICE: {mode: verified_free_only}
  SIGNING_DISTRIBUTION: {mode: free_methods_only}
on_exhaustion: route_to_verified_free_alternative_else_preserve_state
unknown_cost: deny_execution
public_repository_conversion_allowed: false
monthly_free_tier_is_permanent_solution: false
publication_candidate: separately_reviewed_product_source_only_after_explicit_user_approval
authorized_public_product:
  repository: jawadresearchai-creator/appfusion-product-public
  authorization: explicit_user_source_publication_2026_09_04
  history_policy: fresh_reviewed_product_history_only
  runners: [ubuntu-24.04, macos-15]
  private_inputs_or_private_source_proxy_allowed: false
  private_foundry_and_historical_product_workflows: disabled
new_provider_repository_access: requires_user_authorization
github_usage:
  policy: ESSENTIAL_ONLY
  required_for:
    - version_controlled_source_and_contracts
    - reproducible_builds_and_tests
    - security_and_clean_room_gates
    - approval_milestone_and_release_checkpoints
  prohibited_for:
    - ordinary_reasoning_or_document_review
    - idle_polling
    - high_frequency_working_state
    - bulky_source_inputs_reports_screenshots_or_videos
    - duplicate_work_already_verified_on_another_approved_surface
  controls:
    - path_filtered_workflows
    - cancel_superseded_runs
    - bounded_timeouts
    - no_billing_no_overages_no_paid_services
    - fail_closed_before_runner_allocation
    - no_automatic_paid_fallback
routing:
  CHATGPT_WEB:
    - reasoning
    - capability_comparison
    - planning_and_report_drafting
    - interactive_decisions_within_existing_authority
  GOOGLE_DRIVE:
    - projections_of_committed_git_control_state
    - apk_and_other_source_inputs
    - reports_and_evidence
    - screenshots_videos_and_large_artifacts
  GITHUB:
    - source_code
    - schemas_and_policies
    - small_checkpoint_manifests
    - reproducible_ci_gates
    - releases
  OPTIONAL_LOCAL:
    - diagnostics
    - development_acceleration
    - equivalent_build_and_test_gates_with_cloud_saved_evidence

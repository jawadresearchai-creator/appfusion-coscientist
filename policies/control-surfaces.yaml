schema_version: 1.0.0
canonical_authority: CLOUD
durable_state:
  control_state:
    authority: GIT_EVENT_LEDGER
    repository: jawadresearchai-creator/appfusion-coscientist
    registry_path: state/APPFUSION_PROJECT_REGISTRY.json
    event_path: state/events
    conflict_policy: FAST_FORWARD_EVENT_LEDGER_ELSE_PAUSE
  drive_projection:
    control_folder_id: 1yrcp--SXTWKXKPsimFVlgrMhKLKxftdw
    cadence: AFTER_VALID_GIT_TRANSITION
    role: BULKY_ARTIFACT_STORE_AND_HUMAN_READABLE_PROJECTION
  repositories:
    capability_foundry: jawadresearchai-creator/appfusion-coscientist
    product_foundry: jawadresearchai-creator/appfusion-product
  drive_root_id: 16VrxDweS__ykJylsjGXk2lE1dYImzm71
surfaces:
  CHATGPT_WEB:
    enabled: true
    role: interactive_reasoning_and_authenticated_control
    required_local_filesystem: false
  CODEX_DESKTOP:
    enabled: true
    role: optional_engineering_control_surface
    required_for_operation: false
  OPTIONAL_LOCAL_CLI:
    enabled: true
    role: adapter_and_diagnostics_only
    required_for_operation: false
  PERSISTENT_COORDINATOR_API:
    enabled: false
    role: required_for_SYSTEM_V1_UA
    blocked_reason: BLOCKED_AUTHORIZATION
rules:
  - no_control_surface_owns_canonical_state
  - every_command_uses_versioned_contracts
  - retries_are_idempotent
  - session_loss_does_not_erase_completed_deterministic_work
  - every_new_session_bootstraps_from_the_cloud_registry
  - zero_active_apps_are_reported
  - one_active_app_is_resumed_automatically
  - multiple_active_apps_require_user_selection
  - git_event_ledger_is_authoritative_for_small_control_state
  - drive_projection_never_overwrites_newer_git_state
  - stale_expected_revision_or_rejected_push_pauses_and_reloads

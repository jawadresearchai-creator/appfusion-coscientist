name: Untrusted Analysis Policy Gate

on:
  workflow_dispatch:

permissions: {}

jobs:
  blocked-until-runner-is-compliant:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Declare security blocker
        shell: bash
        run: |
          echo 'BLOCKED_SECURITY_ENVIRONMENT'
          echo 'Untrusted APK parsing/execution is disabled until the selected lane demonstrates network denial, metadata denial, no secrets, and one-way validated promotion.'
          exit 1

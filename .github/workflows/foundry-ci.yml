name: Foundry CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted Foundry source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned bootstrap dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate schemas and cloud-first policy
        run: appfusion bootstrap-check
      - name: Run deterministic tests
        run: pytest -q

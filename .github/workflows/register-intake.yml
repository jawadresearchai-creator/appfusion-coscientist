name: Register Intake Request

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Repository-relative JSON request path under requests/pending
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-request-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted control-plane source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject unsafe request paths
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          case "$REQUEST_PATH" in
            requests/pending/*.json) ;;
            *) echo "request_path must be requests/pending/*.json" >&2; exit 2 ;;
          esac
          test -f "$REQUEST_PATH"
      - name: Install pinned bootstrap dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Create deterministic run-registration bundle
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
        run: appfusion create-run "$REQUEST_PATH" --output-root runs
      - name: Preserve registration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intake-registration-${{ github.run_id }}
          path: runs/
          if-no-files-found: error
          retention-days: 30

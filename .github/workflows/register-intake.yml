name: Register Intake Request

on:
  push:
    branches: [main]
    paths:
      - requests/pending/*.json
  workflow_dispatch:
    inputs:
      request_path:
        description: Repository-relative JSON request path under requests/pending
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-request-metadata-only:
    if: ${{ vars.APPFUSION_FREE_APPROVED_SHA == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted control-plane source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject unsafe request paths
        env:
          REQUEST_PATH: ${{ inputs.request_path || '' }}
        run: |
          if [ -n "$REQUEST_PATH" ]; then
            case "$REQUEST_PATH" in
              requests/pending/*.json) ;;
              *) echo "request_path must be requests/pending/*.json" >&2; exit 2 ;;
            esac
            test -f "$REQUEST_PATH"
          fi
      - name: Install pinned bootstrap dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Create deterministic run-registration bundle
        env:
          REQUEST_PATH: ${{ inputs.request_path || '' }}
        shell: bash
        run: |
          if [ -n "$REQUEST_PATH" ]; then
            appfusion create-run "$REQUEST_PATH" --output-root runs
          else
            find requests/pending -maxdepth 1 -type f -name '*.json' -print0 | while IFS= read -r -d '' request; do
              appfusion create-run "$request" --output-root runs
            done
          fi
      - name: Preserve registration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intake-registration-${{ github.run_id }}
          path: runs/
          if-no-files-found: error
          retention-days: 30

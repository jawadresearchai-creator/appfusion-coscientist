[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "appfusion-foundry"
version = "0.1.0"
description = "Cloud-first AppFusion Capability Foundry bootstrap"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
appfusion = "appfusion_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
